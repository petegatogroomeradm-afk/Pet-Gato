{% extends "base.html" %}{% block title %}Editar transporte{% endblock %}{% block page_title %}Editar transporte{% endblock %}{% block content %}<div class="card"><form method="post" class="form">
<div class="form-row"><input name="driver_name" value="{{ corrida.driver_name or '' }}" placeholder="Motorista"><input name="driver_phone" value="{{ corrida.driver_phone or '' }}" placeholder="Telefone"></div><select name="service_type">{% for t in fluxos %}<option {{ 'selected' if corrida.service_type==t }}>{{ t }}</option>{% endfor %}</select><input name="pickup_address" value="{{ corrida.pickup_address or '' }}" placeholder="Coleta"><input name="delivery_address" value="{{ corrida.delivery_address or '' }}" placeholder="Entrega"><div class="form-row"><input type="date" name="pickup_date" value="{{ corrida.pickup_date or '' }}"><input type="time" name="pickup_time" value="{{ corrida.pickup_time or '' }}"><input type="time" name="expected_return_time" value="{{ corrida.expected_return_time or '' }}"></div><div class="form-row"><input name="fee" value="{{ corrida.fee or 0 }}" placeholder="Valor"><input name="distance_km" value="{{ corrida.distance_km or 0 }}" placeholder="Distância"></div><select name="payment_status"><option {{ 'selected' if corrida.payment_status=='Pendente' }}>Pendente</option><option {{ 'selected' if corrida.payment_status=='Pago' }}>Pago</option></select><textarea name="observations">{{ corrida.observations or '' }}</textarea><div class="actions-row"><button>Salvar</button><a class="small-button" href="{{ url_for('motorista.motorista', data=corrida.pickup_date) }}">Voltar</a></div></form></div>{% endblock %}
