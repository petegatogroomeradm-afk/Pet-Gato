{% extends "base.html" %}{% block title %}Editar funcionário{% endblock %}{% block page_title %}Editar funcionário{% endblock %}{% block content %}<div class="card"><form method="post" class="form"><input name="name" value="{{ funcionario.name }}" required><input name="registration" value="{{ funcionario.registration }}" required><input name="cpf" value="{{ funcionario.cpf or '' }}" placeholder="CPF"><div class="grid-2"><input name="phone" value="{{ funcionario.phone or '' }}" placeholder="Telefone"><input name="email" value="{{ funcionario.email or '' }}" placeholder="E-mail"></div><input name="role_name" value="{{ funcionario.role_name or '' }}" placeholder="Cargo"><div class="grid-2"><input type="date" name="admission_date" value="{{ funcionario.admission_date or '' }}"><input name="salary" value="{{ funcionario.salary or 0 }}"></div><div class="grid-2"><select name="schedule_id"><option value="">Sem jornada</option>{% for j in jornadas %}<option value="{{ j.id }}" {% if funcionario.schedule_id==j.id %}selected{% endif %}>{{ j.description }}</option>{% endfor %}</select><input name="commission_rate" value="{{ funcionario.commission_rate or 0 }}"></div><textarea name="notes">{{ funcionario.notes or '' }}</textarea><button>Salvar</button><a class="small-button" href="{{ url_for('funcionarios.funcionarios') }}">Cancelar</a></form></div>{% endblock %}
