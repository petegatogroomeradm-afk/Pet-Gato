{% extends "base.html" %}
{% block title %}Editar Pet{% endblock %}{% block page_title %}Editar Pet{% endblock %}{% block page_subtitle %}Atualize o prontuário do animal{% endblock %}
{% block content %}<div class="card narrow-card"><form method="post" enctype="multipart/form-data" class="form"><select name="client_id" required>{% for c in clientes %}<option value="{{ c.id }}" {% if c.id == pet.client_id %}selected{% endif %}>{{ c.nome }}</option>{% endfor %}</select><div class="form-grid-2"><input name="nome" value="{{ pet.nome }}" required><input name="especie" value="{{ pet.especie or '' }}" placeholder="Espécie"><input name="raca" value="{{ pet.raca or '' }}" placeholder="Raça"><input name="porte" value="{{ pet.porte or '' }}" placeholder="Porte"><input name="idade" value="{{ pet.idade or '' }}" placeholder="Idade"><input name="sexo" value="{{ pet.sexo or '' }}" placeholder="Sexo"><input name="cor" value="{{ pet.cor or '' }}" placeholder="Cor"><input name="peso" value="{{ pet.peso or '' }}" placeholder="Peso"><input type="date" name="data_nascimento" value="{{ pet.data_nascimento or '' }}"><input name="microchip" value="{{ pet.microchip or '' }}" placeholder="Microchip"></div><label class="check-inline"><input type="checkbox" name="castrado" value="1" {% if pet.castrado %}checked{% endif %}> Castrado</label><label class="file-field">Trocar foto<input type="file" name="foto" accept="image/*"></label><textarea name="alergias">{{ pet.alergias or '' }}</textarea><textarea name="medicamentos">{{ pet.medicamentos or '' }}</textarea><textarea name="alimentacao">{{ pet.alimentacao or '' }}</textarea><textarea name="temperamento">{{ pet.temperamento or '' }}</textarea><textarea name="preferencia_tosa">{{ pet.preferencia_tosa or '' }}</textarea><textarea name="observacoes">{{ pet.observacoes or '' }}</textarea><div class="actions"><button>Salvar alterações</button><a class="secondary-button" href="{{ url_for('pets.visualizar_pet', pet_id=pet.id) }}">Cancelar</a></div></form></div>{% endblock %}
