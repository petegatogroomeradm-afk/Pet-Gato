{% extends "base.html" %}{% block title %}Editar jornada{% endblock %}{% block page_title %}Editar jornada{% endblock %}{% block content %}<div class="card"><form method="post" class="form"><input name="description" value="{{ jornada.description }}" required><div class="grid-2"><input type="time" name="entrada" value="{{ jornada.entrada or '' }}"><input type="time" name="saida_intervalo" value="{{ jornada.saida_intervalo or '' }}"></div><div class="grid-2"><input type="time" name="retorno_intervalo" value="{{ jornada.retorno_intervalo or '' }}"><input type="time" name="saida_final" value="{{ jornada.saida_final or '' }}"></div><input type="number" name="tolerancia" value="{{ jornada.tolerancia or 10 }}"><button>Salvar</button><a class="small-button" href="{{ url_for('jornadas.jornadas') }}">Cancelar</a></form></div>{% endblock %}
