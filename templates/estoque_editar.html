{% extends "base.html" %}{% block title %}Editar produto{% endblock %}{% block page_title %}Editar produto{% endblock %}{% block page_subtitle %}Cadastro completo do item{% endblock %}{% block content %}
<div class="card"><form method="post" class="form stock-form"><div class="grid-2"><label>Produto<input name="name" value="{{ produto.name }}" required></label><label>Marca<input name="brand" value="{{ produto.brand or '' }}"></label></div><div class="grid-2"><label>Categoria<input name="category" value="{{ produto.category or '' }}"></label><label>Subcategoria<input name="subcategory" value="{{ produto.subcategory or '' }}"></label></div><div class="grid-2"><label>SKU<input name="sku" value="{{ produto.sku or '' }}"></label><label>Código de barras<input name="barcode" value="{{ produto.barcode or '' }}"></label></div><div class="grid-3"><label>Unidade<input name="unit" value="{{ produto.unit or 'un' }}"></label><label>Mínimo<input name="min_quantity" value="{{ produto.min_quantity or 0 }}"></label><label>Máximo<input name="max_quantity" value="{{ produto.max_quantity or 0 }}"></label></div><div class="grid-2"><label>Custo<input name="cost_price" value="{{ produto.cost_price or 0 }}"></label><label>Venda<input name="sale_price" value="{{ produto.sale_price or 0 }}"></label></div><div class="grid-2"><label>Fornecedor<input name="supplier" value="{{ produto.supplier or '' }}"></label><label>Localização<input name="location" value="{{ produto.location or '' }}"></label></div><label>Validade<input type="date" name="expiration_date" value="{{ produto.expiration_date or '' }}"></label><div class="form-actions"><button>Salvar alterações</button><a class="small-button" href="{{ url_for('estoque.estoque') }}">Cancelar</a></div></form></div>{% endblock %}
