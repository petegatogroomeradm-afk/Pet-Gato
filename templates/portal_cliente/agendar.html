{% extends 'portal_cliente/base.html' %}{% block content %}<form method="post" class="card form"><h1>Solicitar agendamento</h1><p class="notice">O horário só será confirmado após aprovação da equipe da Pet & Gatô.</p>{% if not pets %}<div class="flash">Cadastre um pet antes de solicitar um horário.</div><a class="btn" href="{{ url_for('portal_cliente.novo_pet') }}">Cadastrar pet</a>{% else %}<label>Pet</label><select name="pet_id" required>{% for pet in pets %}<option value="{{ pet.id }}">{{ pet.nome }}</option>{% endfor %}</select><div class="row"><div><label>Serviço</label><select name="servico" required>{% for item in servicos %}<option>{{ item }}</option>{% endfor %}</select></div><div><label>Data desejada</label><input id="data" type="date" min="{{ hoje }}" name="data" required></div></div><label>Horário disponível</label><select id="horario" name="horario" required><option value="">Escolha primeiro a data</option></select><label><input type="checkbox" name="transport_required" style="width:auto"> Preciso de Táxi Dog</label><label>Observações</label><textarea name="observacoes" placeholder="Informe detalhes importantes"></textarea><button class="btn">Enviar solicitação</button>{% endif %}</form><script>const data=document.getElementById('data'),hora=document.getElementById('horario');if(data){data.addEventListener('change',async()=>{hora.innerHTML='<option>Carregando...</option>';const r=await fetch(`{{ url_for('portal_cliente.horarios_disponiveis') }}?data=${data.value}`);const j=await r.json();hora.innerHTML=j.horarios.length?j.horarios.map(h=>`<option>${h}</option>`).join(''):'<option value="">Nenhum horário disponível</option>';});}</script>{% endblock %}
