{% extends 'portal_cliente/base.html' %}{% block content %}<form method="post" class="card form"><h1>Solicitar agendamento</h1><p>O horário será confirmado pela equipe após aprovação.</p>{% if not pets %}<div class="flash">Cadastre um pet antes de solicitar um horário.</div><a class="btn" href="{{ url_for('portal_cliente.novo_pet') }}">Cadastrar pet</a>{% else %}<label>Pet</label><select name="pet_id" required>{% for pet in pets %}<option value="{{ pet.id }}">{{ pet.nome }}</option>{% endfor %}</select><div class="row"><div><label>Serviço</label><select name="servico" required>{% for item in servicos %}<option>{{ item }}</option>{% endfor %}</select></div><div><label>Data desejada</label><input type="date" min="{{ hoje }}" name="data" required></div></div><label>Horário desejado</label><select name="horario" required>{% for hora in horas %}<option>{{ hora }}</option>{% endfor %}</select><label><input type="checkbox" name="transport_required" style="width:auto"> Preciso de Táxi Dog</label><label>Observações</label><textarea name="observacoes" placeholder="Informe detalhes importantes"></textarea><button class="btn">Enviar solicitação</button>{% endif %}</form>{% endblock %}
