<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Portal do Cliente | Pet & Gatô{% endblock %}</title><style>
:root{--p:#6d28d9;--p2:#c026d3;--bg:#f7f4fb;--card:#fff;--text:#241b2f;--muted:#6b6473;--ok:#dcfce7;--warn:#fef3c7;--bad:#fee2e2}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}header{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:16px 0}.wrap{width:min(1040px,92%);margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-size:22px;font-weight:800}.nav a{color:#fff;text-decoration:none;margin-left:14px;font-weight:700}.hero{padding:52px 0;text-align:center}.hero h1{font-size:clamp(32px,6vw,56px);margin:0 0 12px}.hero p{font-size:18px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.card{background:var(--card);border:1px solid #e8e0ef;border-radius:18px;padding:22px;box-shadow:0 12px 30px rgba(62,31,94,.08)}.form{max-width:720px;margin:32px auto}.form label{display:block;font-weight:700;margin:14px 0 6px}.form input,.form select,.form textarea{width:100%;padding:13px;border:1px solid #d8cce2;border-radius:10px;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.btn{display:inline-block;border:0;border-radius:11px;padding:13px 18px;background:linear-gradient(90deg,var(--p),var(--p2));color:#fff;text-decoration:none;font-weight:800;cursor:pointer}.btn.alt{background:#fff;color:var(--p);border:1px solid #d8cce2}.actions{display:flex;gap:10px;flex-wrap:wrap}.flash{padding:12px 15px;border-radius:10px;margin:16px 0;background:var(--warn)}.flash.success{background:var(--ok)}.flash.danger{background:var(--bad)}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #eee;text-align:left}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eee;font-size:12px;font-weight:800}.status-aprovacao{background:#fef3c7}.status-agendado,.status-confirmado{background:#dcfce7}.status-recusado,.status-cancelado{background:#fee2e2}@media(max-width:650px){.row{grid-template-columns:1fr}.top{align-items:flex-start}.nav{display:flex;flex-direction:column}.nav a{margin:4px 0}}
</style></head><body><header><div class="wrap top"><div class="brand">🐾 Pet & Gatô</div><nav class="nav">{% if session.get('client_portal_id') %}<a href="{{ url_for('portal_cliente.painel') }}">Minha conta</a><a href="{{ url_for('portal_cliente.agendar') }}">Agendar</a><a href="{{ url_for('portal_cliente.sair') }}">Sair</a>{% else %}<a href="{{ url_for('portal_cliente.login_cliente') }}">Entrar</a><a href="{{ url_for('portal_cliente.cadastro') }}">Criar conta</a>{% endif %}</nav></div></header><main class="wrap">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
