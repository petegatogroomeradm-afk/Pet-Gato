{% extends 'portal_cliente/base.html' %}{% block content %}<form method="post" class="card form" style="max-width:620px"><h1>Solicitar reagendamento</h1><p>{{ item.pet_nome }} • {{ item.servico }}</p><p class="muted">Atual: {{ item.data_agendamento }} às {{ item.horario }}</p><label>Nova data</label><input id="data" type="date" name="data" min="{{ hoje }}" required><label>Novo horário</label><select id="horario" name="horario" required><option value="">Escolha primeiro a data</option></select><button class="btn">Enviar para aprovação</button></form><script>const data=document.getElementById('data'),hora=document.getElementById('horario');data.addEventListener('change',async()=>{const r=await fetch(`{{ url_for('portal_cliente.horarios_disponiveis') }}?data=${data.value}&ignorar_id={{ item.id }}`);const j=await r.json();hora.innerHTML=j.horarios.length?j.horarios.map(h=>`<option>${h}</option>`).join(''):'<option value="">Nenhum horário disponível</option>';});</script>{% endblock %}
