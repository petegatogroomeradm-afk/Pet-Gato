{% extends 'portal_cliente/base.html' %}{% block content %}<form method="post" class="card form"><h1>Meus dados</h1><div class="row"><div><label>Nome</label><input name="nome" value="{{ conta.nome }}" required></div><div><label>E-mail</label><input type="email" name="email" value="{{ conta.email }}" required></div></div><div class="row"><div><label>Telefone</label><input name="telefone" value="{{ conta.telefone or '' }}" required></div><div><label>WhatsApp</label><input name="whatsapp" value="{{ conta.whatsapp or '' }}"></div></div><label>Endereço</label><input name="endereco" value="{{ conta.endereco or '' }}"><label><input type="checkbox" name="consentimento_marketing" style="width:auto" {% if conta.consentimento_marketing %}checked{% endif %}> Aceito receber lembretes e novidades.</label><div class="actions"><button class="btn">Salvar dados</button><a class="btn alt" href="{{ url_for('portal_cliente.alterar_senha') }}">Alterar senha</a></div></form>{% endblock %}
