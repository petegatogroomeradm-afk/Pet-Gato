{% extends 'portal_cliente/base.html' %}{% block content %}<form method="post" class="card form"><h1>{{ 'Editar pet' if pet else 'Cadastrar pet' }}</h1><div class="row"><div><label>Nome</label><input name="nome" value="{{ pet.nome if pet else '' }}" required></div><div><label>Espécie</label><select name="especie">{% for x in ['Cão','Gato','Outro'] %}<option {% if pet and pet.especie==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></div></div><div class="row"><div><label>Raça</label><input name="raca" value="{{ pet.raca if pet else '' }}"></div><div><label>Porte</label><select name="porte"><option value="">Selecione</option>{% for x in ['Pequeno','Médio','Grande'] %}<option {% if pet and pet.porte==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></div></div><div class="row"><div><label>Data de nascimento</label><input type="date" name="data_nascimento" value="{{ pet.data_nascimento if pet else '' }}"></div><div><label>Sexo</label><select name="sexo"><option value="">Selecione</option>{% for x in ['Macho','Fêmea'] %}<option {% if pet and pet.sexo==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></div></div><div class="row"><div><label>Peso (kg)</label><input type="number" step="0.01" name="peso" value="{{ pet.peso if pet and pet.peso is not none else '' }}"></div><div><label><input type="checkbox" name="castrado" style="width:auto" {% if pet and pet.castrado %}checked{% endif %}> Castrado</label></div></div><label>Alergias</label><textarea name="alergias">{{ pet.alergias if pet else '' }}</textarea><label>Medicamentos</label><textarea name="medicamentos">{{ pet.medicamentos if pet else '' }}</textarea><label>Temperamento e cuidados</label><textarea name="temperamento">{{ pet.temperamento if pet else '' }}</textarea><label>Preferência de tosa</label><textarea name="preferencia_tosa">{{ pet.preferencia_tosa if pet else '' }}</textarea><label>Observações</label><textarea name="observacoes">{{ pet.observacoes if pet else '' }}</textarea><button class="btn">{{ 'Salvar alterações' if pet else 'Salvar pet' }}</button></form>{% endblock %}
