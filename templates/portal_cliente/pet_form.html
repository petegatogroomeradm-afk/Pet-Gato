{% extends 'portal_cliente/base.html' %}{% block content %}<form method="post" class="card form"><h1>Cadastrar pet</h1><div class="row"><div><label>Nome</label><input name="nome" required></div><div><label>Espécie</label><select name="especie"><option>Cão</option><option>Gato</option><option>Outro</option></select></div></div><div class="row"><div><label>Raça</label><input name="raca"></div><div><label>Porte</label><select name="porte"><option value="">Selecione</option><option>Pequeno</option><option>Médio</option><option>Grande</option></select></div></div><div class="row"><div><label>Data de nascimento</label><input type="date" name="data_nascimento"></div><div><label>Sexo</label><select name="sexo"><option value="">Selecione</option><option>Macho</option><option>Fêmea</option></select></div></div><div class="row"><div><label>Peso (kg)</label><input type="number" step="0.01" name="peso"></div><div><label><input type="checkbox" name="castrado" style="width:auto"> Castrado</label></div></div><label>Alergias</label><textarea name="alergias"></textarea><label>Medicamentos</label><textarea name="medicamentos"></textarea><label>Temperamento e cuidados</label><textarea name="temperamento"></textarea><label>Preferência de tosa</label><textarea name="preferencia_tosa"></textarea><label>Observações</label><textarea name="observacoes"></textarea><button class="btn">Salvar pet</button></form>{% endblock %}
